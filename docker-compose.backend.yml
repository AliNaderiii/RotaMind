services:
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: rotamind
      POSTGRES_USER: rotamind
      POSTGRES_PASSWORD: rotamind
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: ./software/rota-inference
    ports: ["8000:8000"]
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql://rotamind:rotamind@db:5432/rotamind
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000
volumes:
  pgdata:
