services:
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: rotamind
      POSTGRES_USER: rotamind
      POSTGRES_PASSWORD: rotamind
    ports: ["5433:5432"]  # edge uses 5433 to not clash backend 5432
    volumes: ["pgdata_edge:/var/lib/postgresql/data"]
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }

  api-edge:
    build:
      context: ./software/rota-inference
      dockerfile: Dockerfile.edge
    ports: ["8001:8000"]
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql://rotamind:rotamind@db:5432/rotamind
      EDGE_MODE: "1"
      MODEL_INT8: model/phyq_paper.int8.onnx
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 256M }
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000

volumes:
  pgdata_edge:
